name: Vigilia CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    # O núcleo (functions/vigilia_core) não depende de streamlit nem pandas:
    # instalamos apenas o necessário para a suíte de testes — CI rápido.
    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pytest

    - name: Syntax and merge-conflict verification
      run: python verify.py

    - name: Unit tests (vigilia_core)
      run: pytest tests/ -v
